services:
  - type: web
    name: mdip-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        value: "https://mkurfdbznwhgocecombq.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MDIP_AUTH_SECRET
        generateValue: true
      - key: MDIP_ADMIN_KEY
        generateValue: true
